# Weekly update PRs, grouped per ecosystem. Merged by hand: merging to main deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Move Node to the next LTS release deliberately; odd-numbered majors
    # like 25 are short-lived and outside what the tooling supports.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
