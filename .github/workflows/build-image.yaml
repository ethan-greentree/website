name: Build and publish website image

on:
  push:
    branches: [main]

# Cancel older builds when main changes so they do not overwrite latest later.
# A successful build triggers the deployment workflow.
concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCAN_TAG: website:scan

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the scan results appear under the repository's Security tab.
      security-events: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.SCAN_TAG }}

      - name: Scan the image and report all findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload the scan results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Only critical findings with a fix available stop the deploy; base
      # images often carry known issues that have no fix yet.
      - name: Stop on fixable critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Sign in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_IMAGE }}:latest
