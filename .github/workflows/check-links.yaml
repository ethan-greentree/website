name: Check links

# Reports broken links without affecting deploys. External sites change on
# their own, so a weekly run catches links that rot between edits.
on:
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Matches the version installed in the Dockerfile.
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Build the site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}/dist"
            --no-progress
            --max-retries 3
            --exclude "^https://www\.linkedin\.com/"
            "dist/**/*.html"
          fail: true
