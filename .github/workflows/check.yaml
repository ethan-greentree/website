name: Check

# Formatting, lint, type checks, tests and a build, all through Vite+.
# Runs alongside the image build; it doesn't gate deploys.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true

      # The type check needs Astro's generated types, which aren't committed.
      - name: Generate Astro types
        run: vp exec astro sync

      - name: Check formatting, lint and types
        run: vp check

      - name: Run tests
        run: vp test

      - name: Build the site
        run: vp run build
